[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovers, artifact replays deterministically."
requires-python = ">=3.10"

dependencies = [
    # Schemas are the contract; everything else is an implementation detail.
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # Control plane
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",       # run event stream -> console

    # Action layer. Playwright supplies a browser and a way to inject input
    # events. It is deliberately NOT doing element resolution — no page.locator().
    "playwright>=1.49",

    # Perception plumbing
    "mss>=9.0",                 # X display capture (the LLM sees what VNC shows)
    "pillow>=10.4",
    "numpy>=1.26",
    "rtree>=1.3",               # spatial index over elements at replay time

    # Discovery. LiteLLM rather than a provider SDK: the model is a swappable
    # component here, not an architectural commitment. One call signature covers
    # xAI, Anthropic, OpenAI and a local endpoint, which means "which model is
    # best at driving a UI" stays an empirical question we can answer by changing
    # one env var instead of a design decision baked into the loop.
    "litellm>=1.55",

    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Heavy. Split out so `pip install -e .` stays fast for tests and CI, and so the
# schema/replay layers can be exercised without a multi-GB torch download.
perception = [
    # Default PyPI wheels are CUDA-enabled. The container is given GPU access in
    # docker-compose; OmniParser's detector falls back to CPU on its own if no
    # device is visible, so this is not a hard requirement to run.
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",         # OmniParser icon_detect is a YOLO checkpoint
    "huggingface-hub>=0.26",
    # PP-OCR models executed by ONNX Runtime rather than by the paddle framework.
    # Same detection and recognition networks; only the runtime differs.
    #
    # Paddle was tried and rejected on evidence, not preference:
    #   - PyPI `paddlepaddle` is compiled without CUDA, so device="gpu" cannot
    #     work, and its CPU path hits an unimplemented oneDNN/PIR op. The only
    #     configuration that runs at all is enable_mkldnn=False, at ~33s/frame.
    #   - `paddlepaddle-gpu` (cu126) does work, but drags in nvidia-nccl-cu12
    #     2.25.1, which collides on the same site-packages path as the
    #     nvidia-nccl-cu13 2.29.7 that torch 2.13 (cu130) needs. torch then fails
    #     to import with `undefined symbol: ncclCommResume`, taking OmniParser
    #     with it. Not pinnable — one file, two owners. It also added 8.4GB.
    #
    # Measured on the same screenshot: 1.7s vs 33s, 141 vs 144 lines.
    "rapidocr>=3.0",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
# A group, not an optional-dependency: groups are never published and never
# installed transitively, and `uv sync --no-dev` in the container excludes them
# without having to enumerate what to keep.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
# The perception backends wrap untyped ML libraries; strictness there buys nothing.
[[tool.mypy.overrides]]
module = ["cua.perception.detect", "cua.perception.ocr", "ultralytics.*", "paddleocr.*", "mss.*", "rtree.*"]
ignore_missing_imports = true
disallow_untyped_calls = false
