# Guardrails for the mock back-office target app.
#
# Loaded by cua.policy.Policy and enforced identically on the discovery and replay
# paths. Per-application, not per-capability: recoverable conditions like a session
# interstitial can interrupt any flow on this app, and duplicating them into every
# artifact would guarantee they drift apart.

app: targetapp

# --- Allowlist -------------------------------------------------------------
# The agent may not act outside these. Note what is absent: the control plane
# itself (:8000), the console (:3000), and the noVNC endpoint (:6080). The agent
# runs on the same machine as its own operator surface, so "localhost" would be a
# hole, not a convenience.
allowed_url_patterns:
  - "^http://targetapp:8080(/.*)?$"

# Primitives the agent may use at all. `navigate` is allowed but the URL is still
# checked against the patterns above.
allowed_actions: [navigate, click, type, key, scroll, extract, wait, assert]

# --- Risk ------------------------------------------------------------------
# What to do when a step declares risk: risky.
#   allow   | confirm (escalate to a human first) | block
# `confirm` for the demo: it exercises the escalation path on the write capability
# rather than requiring a contrived failure to trigger it.
risky_disposition: confirm

# Intent phrases that force a step to be treated as risky regardless of what the
# recording declared. A backstop against a mislabelled artifact — cheap, and the
# failure mode it prevents (a submit recorded as `safe`) is the expensive one.
risky_intent_patterns:
  - "(?i)\\b(submit|confirm|transfer|send|delete|remove|close|authorize|approve)\\b"

# --- Recoverable conditions ------------------------------------------------
# Detector + ordered recovery + a cap. The cap is the important field: dismissing
# the same modal eleven times means the dismissal is not working, and that is a
# hard failure rather than eleven successful recoveries.
recoveries:
  - name: maintenance_notice
    detector: { kind: text_present, value: "scheduled maintenance" }
    actions:
      - { action: click, anchor_text: "Dismiss" }
    max_per_run: 2

  - name: transient_slow_load
    detector: { kind: text_present, value: "Loading" }
    actions:
      - { action: wait, value: "2000" }
    max_per_run: 3

# Session expiry is deliberately NOT a recovery. Re-authenticating mid-flow would
# mean the automation holds credentials and can silently resume a run whose
# context may no longer be valid. It escalates instead.

# --- Declared conditions with no handler -----------------------------------
# Two lists, split by who can clear the condition. Without them both of these
# states would surface as "the checkpoint did not hold", which sends an operator
# looking for a layout problem that is not there.

# Nobody can fix this from here: stop with APP_ERROR and keep the evidence.
app_errors:
  - name: application_error
    detector: { kind: text_present, value: "An unexpected error occurred" }

# A human can fix this: park the run and hand them the live session.
escalations:
  - name: session_expired
    detector: { kind: text_present, value: "session has expired" }
  - name: sign_on_required
    detector: { kind: text_present, value: "Staff Sign-On" }

# --- Sign-on ---------------------------------------------------------------
# A precondition of every capability, and never a capability itself: this is the
# one flow that types a credential, and keeping it here means no artifact ever
# references one. `{{username}}` and `{{password}}` are resolved from
# configuration in the action layer, below the point where anything is
# serialized.
#
# It is described exactly the way a capability describes anything — by what is on
# the screen — because the mechanism is the same one. Only the storage differs.
sign_on:
  detector: { kind: text_present, value: "Sign-On" }
  steps:
    - action: type
      anchor_text: "User ID"
      relation: right_of
      value: "{{username}}"
      intent: "type the operator id"
    - action: type
      anchor_text: "Password"
      relation: right_of
      value: "{{password}}"
      intent: "type the operator password"
    - action: click
      anchor_text: "Sign On"
      intent: "submit the sign-on form"

# --- Discovery -------------------------------------------------------------
# What the model is told it is looking at. Here rather than in the prompt file
# because it is the one part of the prompt that is a fact about this application
# rather than about how the loop works.
surface: >-
  a bank back-office application, operated on behalf of a credit-union teller

# --- Redaction -------------------------------------------------------------
# Seam only in v1 — see cua.policy.redact. Patterns are declared now so the
# implementation has something to consume.
redact_patterns:
  - "\\b\\d{3}-\\d{2}-\\d{4}\\b"            # SSN
  - "\\b(?:\\d[ -]*?){13,16}\\b"            # PAN
  - "(?i)password[^\\n]*"
