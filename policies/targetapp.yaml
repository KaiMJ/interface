# Guardrails for the mock back-office target app.
#
# Enforced identically on the discovery and replay paths. Per-application, not
# per-capability: a session interstitial interrupts any flow on this app, and
# duplicating it into every artifact would guarantee the copies drift.
#
# One file per application, selected with `--app`. A second application is a second
# file — nothing in backend/src knows this one exists.

# --- Identity --------------------------------------------------------------
# What a recorded capability carries in its AppRef, so an artifact says which
# product it drives rather than which URL it was recorded at.
app: targetapp
vendor: null

# Which installs this app's artifacts are valid against. A pattern, not a literal:
# the same vendor product at a second institution is the same application at a
# different address.
base_url_pattern: "^http://targetapp:8080(/.*)?$"

# This deployment's entry point — a per-institution fact, overridden by
# CUA_TARGET_BASE_URL. How a second tenant runs the same policy.
entry_url: http://targetapp:8080

# The fault-injection harness. Demo apps have one, a real core banking system does not,
# and an app declaring none gets no fault panel in the console. Deliberately *excluded*
# from the allowlist below: arming a fault is done to the automation from outside it,
# never as a recordable step.
fault_url: http://targetapp:8080/api/faults

# --- Allowlist -------------------------------------------------------------
# The agent may not act outside these. Absent: the control plane (:8000), the console
# (:3000) and noVNC (:6080) — the agent runs on the same machine as its own operator
# surface, so "localhost" would be a hole. `/dev` and `/api/faults` are excluded for the
# same reason: an agent that can arm its own faults can disarm them.
allowed_url_patterns:
  - "^http://targetapp:8080(?!/dev|/api/faults)(/.*)?$"

# Primitives the agent may use. `navigate` is allowed; the URL is still checked.
allowed_actions: [navigate, click, type, key, scroll, extract, wait, assert]

# --- Risk ------------------------------------------------------------------
# What to do when a step declares `risk: risky`.
#   allow | confirm (escalate to a human first) | block
# `confirm` here, so the write capability exercises the escalation path.
risky_disposition: confirm

# Intent phrases that force `risky` whatever the recording declared. A backstop
# against a mislabelled artifact — cheap, and the failure it prevents (a submit
# recorded as `safe`) is the expensive one.
risky_intent_patterns:
  - "(?i)\\b(submit|confirm|transfer|send|delete|remove|close|authorize|approve)\\b"

# --- Recoverable conditions ------------------------------------------------
# Detector + ordered actions + a cap. The cap matters: dismissing the same modal eleven
# times means the dismissal is not working, which is a hard failure rather than eleven
# successful recoveries.
#
# Actions: `wait` (ms), `click` (by anchor text), `key`, `reload` (for a condition a wait
# alone cannot clear), `sign_on`. `sign_on` is gated in the engine — available only while
# no risky action has run, and it restarts the capability from step 1, because signing
# back in returns the session and not your place in the flow.
recoveries:
  - name: maintenance_notice
    detector: { kind: text_present, value: "scheduled maintenance" }
    actions:
      - { action: click, anchor_text: "Dismiss" }
    max_per_run: 2

  - name: transient_slow_load
    detector: { kind: text_present, value: "Loading" }
    actions:
      - { action: wait, value: "2000" }
    max_per_run: 3

  # Session expiry, on a run that has done nothing irreversible.
  #
  # A mid-flow expiry costs the run its place in the flow, not the credential — the
  # session already types one at sign-on. So the handler is "sign in and start over",
  # allowed only while no risky step has executed: a balance read re-runs itself, a
  # confirmed transfer parks for a person. `max_per_run: 1` — twice is not transient.
  - name: session_expired
    detector: { kind: text_present, value: "session has expired" }
    actions:
      - { action: sign_on }
    max_per_run: 1

# --- Declared conditions with no handler -----------------------------------
# Split by who can clear it. Without these, both surface as "the checkpoint did not
# hold" — which sends an operator looking for a layout problem that is not there.

# Nobody can fix this from here: stop with APP_ERROR and keep the evidence.
app_errors:
  - name: application_error
    detector: { kind: text_present, value: "An unexpected error occurred" }

# A human can fix this: park the run and hand them the live session.
escalations:
  # Signed out with no explanation, which is an escalation while `session_expired` is
  # not: the app saying so is a condition with a known cause and handler. Recoveries
  # match before escalations, so an expiry that says so is recovered.
  - name: sign_on_required
    detector: { kind: text_present, value: "Staff Sign-On" }

# --- Business outcomes -----------------------------------------------------
# Detectors for legitimate alternative answers, owned by the application because the
# wording is: every capability that searches for a member meets the same "no member
# matches" screen, and copies in each artifact would drift.
#
# Which flows may *return* which answer is not decided here. A capability opts in by
# name (`business_outcomes: [{ name: member_not_found }]`) and inherits the detector,
# because that list is the contract its caller branches on.
#
# Taught, not guessed: `cua learn-outcome` demonstrates one, `cua diagnose` proposes
# one off a run that stopped on an undeclared screen. Both copy the wording off the
# screen that produces it.
business_outcomes:
  - name: member_not_found
    description: no member exists with that id
    detector:
      kind: text_present
      value: "No member matches the search criteria entered."
    result_fields: [member_id]

  - name: permission_denied
    description: the signed-in operator may not view this member
    detector:
      kind: text_present
      value: "You do not have permission to view this member"
    result_fields: [member_id]

# --- Text that changes on its own ------------------------------------------
# Lines that tick while nothing is happening. Excluded when perception decides whether
# the screen stopped moving, and nowhere else — a countdown is still read and still
# available to a checkpoint.
#
# Without this a countdown defeats both settle tests at once, so every step burns two
# timeouts on a screen that was ready throughout. Any app showing a clock or a "last
# refreshed" stamp needs an entry.
volatile_text:
  - "\\b\\d{1,2}:\\d{2}(:\\d{2})?\\b"      # clocks and session countdowns
  - "(?i)last (refreshed|updated)"

# --- Sign-on ---------------------------------------------------------------
# A precondition of every capability and a capability of none: the one flow that
# types a credential, kept here so no artifact ever references one. `{{username}}`
# and `{{password}}` are resolved in the action layer, below serialization.
#
# Described the way a capability describes anything — by what is on the screen —
# because the mechanism is the same. Only the storage differs.
sign_on:
  detector: { kind: text_present, value: "Sign-On" }
  steps:
    - action: type
      anchor_text: "User ID"
      relation: right_of
      value: "{{username}}"
      intent: "type the operator id"
    - action: type
      anchor_text: "Password"
      relation: right_of
      value: "{{password}}"
      intent: "type the operator password"
    - action: click
      anchor_text: "Sign On"
      intent: "submit the sign-on form"

# --- Discovery -------------------------------------------------------------
# What the model is told it is looking at — the one part of the prompt that is a
# fact about this application rather than about how the loop works.
surface: >-
  a bank back-office application, operated on behalf of a credit-union teller

# --- Redaction -------------------------------------------------------------
# Declared, and deliberately not applied — see `runtime.wiring.build_redactor` for why.
# Masking sensitive *inputs* is separate, always on, and driven by `InputSpec.sensitive`
# rather than by anything here.
redact_patterns:
  - "\\b\\d{3}-\\d{2}-\\d{4}\\b"            # SSN
  - "\\b(?:\\d[ -]*?){13,16}\\b"            # PAN
  - "(?i)password[^\\n]*"
